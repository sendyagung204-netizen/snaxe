<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake X</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --bg-dark: #0a0a0f;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-dark);
            color: white;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        canvas {
            background: #111;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            border: 2px solid #222;
            max-width: 95vw;
            max-height: 70vh;
        }

        .ui-layer {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
        }

        .hud-item { font-size: 1.2rem; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }

        #controls {
            position: absolute;
            bottom: 30px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 10px;
        }

        .btn {
            width: 60px; height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            user-select: none;
        }

        #overlay {
            position: absolute;
            background: rgba(0,0,0,0.85);
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-layer">
        <div class="hud-item">SCORE: <span id="score">0</span></div>
        <div class="hud-item">BEST: <span id="best">0</span></div>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <div id="overlay">
        <h1 id="title">SNAKE X</h1>
        <button onclick="startGame()" style="padding: 15px 30px; background: var(--neon-blue); border: none; font-family: inherit; font-weight: bold; cursor: pointer;">START MISSION</button>
    </div>

    <div id="controls">
        <div></div><div class="btn" onclick="changeDir('UP')">▲</div><div></div>
        <div class="btn" onclick="changeDir('LEFT')">◀</div><div></div><div class="btn" onclick="changeDir('RIGHT')">▶</div>
        <div></div><div class="btn" onclick="changeDir('DOWN')">▼</div><div></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    
    let snake = [{x: 10, y: 10}];
    let food = {x: 15, y: 15};
    let dx = 1, dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snakeBest') || 0;
    let gameActive = false;
    let speed = 150;

    bestEl.textContent = highScore;

    function initCanvas() {
        canvas.width = 400;
        canvas.height = 400;
    }

    function draw() {
        if(!gameActive) return;

        // Background
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Move Snake
        let head = {x: snake[0].x + dx, y: snake[0].y + dy};
        
        // Wall collision
        if(head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20) return gameOver();
        
        snake.unshift(head);
        
        // Food check
        if(head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.textContent = score;
            food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
            speed = Math.max(50, speed - 5);
        } else {
            snake.pop();
        }

        // Render Snake
        ctx.fillStyle = '#00f3ff';
        snake.forEach((part, index) => {
            ctx.shadowBlur = index === 0 ? 15 : 0;
            ctx.shadowColor = '#00f3ff';
            ctx.fillRect(part.x * 20, part.y * 20, 18, 18);
        });

        // Render Food
        ctx.fillStyle = '#ff00ff';
        ctx.shadowBlur = 10;
        ctx.fillRect(food.x * 20, food.y * 20, 18, 18);

        setTimeout(draw, speed);
    }

    function startGame() {
        document.getElementById('overlay').style.display = 'none';
        snake = [{x: 10, y: 10}];
        score = 0;
        gameActive = true;
        draw();
    }

    function gameOver() {
        gameActive = false;
        if(score > highScore) {
            highScore = score;
            localStorage.setItem('snakeBest', highScore);
            bestEl.textContent = highScore;
        }
        alert("GAME OVER! Score: " + score);
        location.reload();
    }

    function changeDir(dir) {
        if(dir === 'UP' && dy === 0) { dx = 0; dy = -1; }
        if(dir === 'DOWN' && dy === 0) { dx = 0; dy = 1; }
        if(dir === 'LEFT' && dx === 0) { dx = -1; dy = 0; }
        if(dir === 'RIGHT' && dx === 0) { dx = 1; dy = 0; }
    }

    // Keyboard support
    window.addEventListener('keydown', e => {
        if(e.key === 'ArrowUp') changeDir('UP');
        if(e.key === 'ArrowDown') changeDir('DOWN');
        if(e.key === 'ArrowLeft') changeDir('LEFT');
        if(e.key === 'ArrowRight') changeDir('RIGHT');
    });

    initCanvas();
</script>
</body>
</html>
